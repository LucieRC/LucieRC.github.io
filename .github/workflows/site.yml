# Site lucierc.github.io : CV + outils FiPu (Repères, Veille, Données, Textes) sous /bercy/.
# - chaque matin de semaine (et via Actions → Site → Run workflow) : collecte des trois outils,
#   enregistrement de leurs bases dans le dépôt, puis publication ;
# - à chaque push sur main : publication seule (CV, mises en page, mots-clés…), sans collecte.
name: Site

on:
  schedule:
    - cron: "30 5 * * 1-5"   # 7 h 30 à Paris l'été, 6 h 30 l'hiver (GitHub peut retarder de quelques minutes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # pousser les bases mises à jour
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      COLLECT: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*/requirements.txt"
      - run: pip install -r veille-fipu/requirements.txt -r reperes-fipu/requirements.txt -r donnees-fipu/requirements.txt

      # Une source ou un outil en échec n'empêche pas la publication : l'échec est affiché dans la page de l'outil.
      - name: Collecte — Veille
        if: env.COLLECT == 'true'
        working-directory: veille-fipu
        run: python update.py
        continue-on-error: true
      - name: Collecte — Repères
        if: env.COLLECT == 'true'
        working-directory: reperes-fipu
        run: python update.py
        continue-on-error: true
      - name: Collecte — Données
        if: env.COLLECT == 'true'
        working-directory: donnees-fipu
        run: python update.py
        continue-on-error: true
      - name: Enregistrer les bases
        if: env.COLLECT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add veille-fipu/data reperes-fipu/data donnees-fipu/data
          if ! git diff --cached --quiet; then
            git commit -m "Collecte du $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Pages des outils
        run: |
          (cd veille-fipu && python build.py)
          (cd reperes-fipu && python build.py)
          (cd Comptabilité_nationale && python page.py)
      - name: Site
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
